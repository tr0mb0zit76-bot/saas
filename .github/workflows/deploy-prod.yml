name: Deploy prod

on:
  push:
    branches:
      - main
      - cursor/traklo-session-integrate-9d42
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy on the server
        required: false
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, traklo-prod]
    environment: production
    steps:
      - name: Deploy on host
        run: |
          set -euo pipefail
          APP_DIR="${PROD_APP_DIR:-/var/www/www-root/data/www/traklo.pro}"
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            REF='${{ github.event.inputs.ref }}'
          else
            REF='${{ github.ref_name }}'
          fi
          cd "$APP_DIR"
          bash scripts/deploy-prod.sh "$REF"
